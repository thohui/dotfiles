[env]
TERM = "xterm-256color"

[terminal]
osc52 = "CopyPaste"

[selection]
save_to_clipboard = true

[font]
normal.family = "JetBrainsMono"
normal.style = "Regular"
bold.family = "JetBrainsMono"
bold.style = "Bold"
italic.family = "JetBrainsMono"
italic.style = "Italic"
bold_italic.family = "JetBrainsMono"
bold_italic.style = "Bold Italic"
size = 12.0

[window]
padding.x = 14
padding.y = 14
decorations = "None"


[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
