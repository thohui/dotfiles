# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- alacritty
bindd = SUPER SHIFT, RETURN, Browser, exec, uwsm-app -- chromium
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- dolphin --new-window
bindd = SUPER, SPACE, Launcher, exec, uwsm-app -- hyprlauncher
bindd = SUPER SHIFT, A, Audio, exec, pavucontrol

# Screenshots
bind = SUPER ALT, 4, exec, grim -g "$(slurp -w 0)" - | wl-copy

 
# WINDOW MANAGEMENT
 
# Close windows
bindd = SUPER, W, Close window, killactive
bindd = CTRL ALT, DELETE, Close all windows, exec, omarchy-hyprland-window-close-all
 
# Control tiling
bindd = SUPER, J, Toggle window split, layoutmsg, togglesplit
bindd = SUPER, P, Pseudo window, pseudo
bindd = SUPER, T, Toggle floating/tiling, togglefloating
bindd = SUPER, F, Full screen, fullscreen, 0
bindd = SUPER CTRL, F, Tiled full screen, fullscreenstate, 0 2
bindd = SUPER ALT, F, Full width, fullscreen, 1
bindd = SUPER, O, Pop window out, exec, omarchy-hyprland-window-pop
bindd = SUPER, L, Toggle workspace layout, exec, omarchy-hyprland-workspace-layout-toggle
 
# WINDOW NAVIGATION & FOCUS
 
# Move focus with arrow keys
bindd = SUPER, LEFT, Focus left, movefocus, l
bindd = SUPER, RIGHT, Focus right, movefocus, r
bindd = SUPER, UP, Focus up, movefocus, u
bindd = SUPER, DOWN, Focus down, movefocus, d
 
# Swap windows
bindd = SUPER SHIFT, h, Swap left, swapwindow, l
bindd = SUPER SHIFT, l, Swap right, swapwindow, r
bindd = SUPER SHIFT, k, Swap up, swapwindow, u
bindd = SUPER SHIFT, j, Swap down, swapwindow, d
 
# Cycle windows
bindd = ALT, TAB, Next window, cyclenext
bindd = ALT SHIFT, TAB, Previous window, cyclenext, prev
 
# Cycle monitors
bindd = CTRL ALT, TAB, Next monitor, focusmonitor, +1
bindd = CTRL ALT SHIFT, TAB, Previous monitor, focusmonitor, -1
 
# WORKSPACE SWITCHING
 
# Switch to workspace 1-10
bindd = SUPER, code:10, Workspace 1, workspace, 1
bindd = SUPER, code:11, Workspace 2, workspace, 2
bindd = SUPER, code:12, Workspace 3, workspace, 3
bindd = SUPER, code:13, Workspace 4, workspace, 4
bindd = SUPER, code:14, Workspace 5, workspace, 5
bindd = SUPER, code:15, Workspace 6, workspace, 6
bindd = SUPER, code:16, Workspace 7, workspace, 7
bindd = SUPER, code:17, Workspace 8, workspace, 8
bindd = SUPER, code:18, Workspace 9, workspace, 9
bindd = SUPER, code:19, Workspace 10, workspace, 10
 
# Move window to workspace
bindd = SUPER SHIFT, code:10, Move to workspace 1, movetoworkspace, 1
bindd = SUPER SHIFT, code:11, Move to workspace 2, movetoworkspace, 2
bindd = SUPER SHIFT, code:12, Move to workspace 3, movetoworkspace, 3
bindd = SUPER SHIFT, code:13, Move to workspace 4, movetoworkspace, 4
bindd = SUPER SHIFT, code:14, Move to workspace 5, movetoworkspace, 5
bindd = SUPER SHIFT, code:15, Move to workspace 6, movetoworkspace, 6
bindd = SUPER SHIFT, code:16, Move to workspace 7, movetoworkspace, 7
bindd = SUPER SHIFT, code:17, Move to workspace 8, movetoworkspace, 8
bindd = SUPER SHIFT, code:18, Move to workspace 9, movetoworkspace, 9
bindd = SUPER SHIFT, code:19, Move to workspace 10, movetoworkspace, 10
 
# Move window silently (don't follow)
bindd = SUPER SHIFT ALT, code:10, Move silent to ws 1, movetoworkspacesilent, 1
bindd = SUPER SHIFT ALT, code:11, Move silent to ws 2, movetoworkspacesilent, 2
bindd = SUPER SHIFT ALT, code:12, Move silent to ws 3, movetoworkspacesilent, 3
bindd = SUPER SHIFT ALT, code:13, Move silent to ws 4, movetoworkspacesilent, 4
bindd = SUPER SHIFT ALT, code:14, Move silent to ws 5, movetoworkspacesilent, 5
bindd = SUPER SHIFT ALT, code:15, Move silent to ws 6, movetoworkspacesilent, 6
bindd = SUPER SHIFT ALT, code:16, Move silent to ws 7, movetoworkspacesilent, 7
bindd = SUPER SHIFT ALT, code:17, Move silent to ws 8, movetoworkspacesilent, 8
bindd = SUPER SHIFT ALT, code:18, Move silent to ws 9, movetoworkspacesilent, 9
bindd = SUPER SHIFT ALT, code:19, Move silent to ws 10, movetoworkspacesilent, 10
 
# Tab between workspaces
bindd = SUPER, TAB, Next workspace, workspace, e+1
bindd = SUPER SHIFT, TAB, Previous workspace, workspace, e-1
bindd = SUPER CTRL, TAB, Previous workspace, workspace, previous
 
# Move workspace to monitor
bindd = SUPER SHIFT ALT, LEFT, Workspace to left, movecurrentworkspacetomonitor, l
bindd = SUPER SHIFT ALT, RIGHT, Workspace to right, movecurrentworkspacetomonitor, r
bindd = SUPER SHIFT ALT, UP, Workspace to up, movecurrentworkspacetomonitor, u
bindd = SUPER SHIFT ALT, DOWN, Workspace to down, movecurrentworkspacetomonitor, d
 
# WINDOW RESIZING
 
# Resize active window
bindd = SUPER, code:20, Expand left, resizeactive, -100 0
bindd = SUPER, code:21, Shrink left, resizeactive, 100 0
bindd = SUPER SHIFT, code:20, Shrink up, resizeactive, 0 -100
bindd = SUPER SHIFT, code:21, Expand down, resizeactive, 0 100
 
# Mouse control
bindmd = SUPER, mouse:272, Move window, movewindow
bindmd = SUPER, mouse:273, Resize window, resizewindow
 
# Scroll workspaces
bindd = SUPER, mouse_down, Next workspace, workspace, e+1
bindd = SUPER, mouse_up, Previous workspace, workspace, e-1
 
################################################################################
# WINDOW GROUPING
################################################################################
 
# Toggle grouping
bindd = SUPER, G, Toggle grouping, togglegroup
bindd = SUPER ALT, G, Ungroup window, moveoutofgroup
 
# Join groups
bindd = SUPER ALT, LEFT, Group left, moveintogroup, l
bindd = SUPER ALT, RIGHT, Group right, moveintogroup, r
bindd = SUPER ALT, UP, Group up, moveintogroup, u
bindd = SUPER ALT, DOWN, Group down, moveintogroup, d
 
# Navigate groups
bindd = SUPER ALT, TAB, Next in group, changegroupactive, f
bindd = SUPER ALT SHIFT, TAB, Prev in group, changegroupactive, b
bindd = SUPER CTRL, LEFT, Group focus left, changegroupactive, b
bindd = SUPER CTRL, RIGHT, Group focus right, changegroupactive, f
 
# Scroll groups
bindd = SUPER ALT, mouse_down, Group next, changegroupactive, f
bindd = SUPER ALT, mouse_up, Group prev, changegroupactive, b
 
# Group by number
bindd = SUPER ALT, code:10, Group window 1, changegroupactive, 1
bindd = SUPER ALT, code:11, Group window 2, changegroupactive, 2
bindd = SUPER ALT, code:12, Group window 3, changegroupactive, 3
bindd = SUPER ALT, code:13, Group window 4, changegroupactive, 4

