animations {
    enabled = yes
    bezier = almostLinear, 0.00, 0.00, 0.95, 0.97
    animation = workspaces, 1, 1.5, almostLinear
    animation = workspacesIn, 1, 1.5, almostLinear
    animation = workspacesOut, 1, 1.0, almostLinear
}

